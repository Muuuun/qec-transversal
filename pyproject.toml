[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qec-transversal"
version = "0.1.0"
description = "Find and certify transversal logical Clifford generators of CSS quantum codes."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ai-qec contributors" }]
dependencies = ["numpy>=1.24"]
keywords = ["quantum-error-correction", "CSS", "qLDPC", "Clifford", "transversal-gates"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "python-igraph>=0.11", "stim>=1.12"]
phase = ["stim>=1.12"]
aut = ["python-igraph>=0.11"]

[project.scripts]
qec-transversal = "qec_transversal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = ["slow: large instances, excluded via -m 'not slow'"]

[tool.ruff]
line-length = 100
target-version = "py39"
